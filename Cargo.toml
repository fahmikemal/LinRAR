[package]
name = "linrar"
version = "0.1.0"
edition = "2024"
authors = ["LinRAR Team"]
license = "MIT"
description = "Modern high-performance universal archive manager for Linux in pure Rust"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.37", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }
zip = "9.0"
flate2 = "1.0"
tar = "0.4"
bzip2 = "0.6"
chrono = "0.4"
walkdir = "2.5"
crc32fast = "1.4"
rayon = "1.10"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.14.3"
xz2 = "0.1.7"
sevenz-rust2 = "0.24.1"

[dev-dependencies]
tempfile = "3.16"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
