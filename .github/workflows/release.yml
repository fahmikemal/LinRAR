name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality-gate:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libxkbcommon-dev \
            libbz2-dev \
            liblzma-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Test Suite
        run: cargo test --all-targets --all-features

  build-and-release:
    name: Build & Publish Release Assets
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libxkbcommon-dev \
            libbz2-dev \
            liblzma-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Optimized Release Binary
        run: cargo build --release --locked

      - name: Strip Binary Symbols
        run: strip target/release/linrar

      - name: Prepare Portable Distribution Bundle (.tar.gz)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          DIST_DIR="linrar-${TAG_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "$DIST_DIR/assets"
          cp target/release/linrar "$DIST_DIR/"
          cp -r assets/icons "$DIST_DIR/assets/"
          cp install.sh "$DIST_DIR/"
          chmod +x "$DIST_DIR/install.sh"
          cp linrar.desktop "$DIST_DIR/"
          cp README.md "$DIST_DIR/"
          cp LICENSE "$DIST_DIR/"

          tar -czvf "${DIST_DIR}.tar.gz" "$DIST_DIR"
          sha256sum "${DIST_DIR}.tar.gz" > "${DIST_DIR}.tar.gz.sha256"

      - name: Build Debian Package (.deb)
        env:
          RAW_VERSION: ${{ github.ref_name }}
        run: |
          VERSION_NUM="${RAW_VERSION#v}"
          DEB_DIR="deb_package/linrar_${VERSION_NUM}_amd64"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor"
          mkdir -p "$DEB_DIR/usr/share/doc/linrar"

          cp target/release/linrar "$DEB_DIR/usr/bin/"
          chmod 755 "$DEB_DIR/usr/bin/linrar"
          cp linrar.desktop "$DEB_DIR/usr/share/applications/"
          cp -r assets/icons/hicolor/* "$DEB_DIR/usr/share/icons/hicolor/"
          cp LICENSE "$DEB_DIR/usr/share/doc/linrar/copyright"
          cp README.md "$DEB_DIR/usr/share/doc/linrar/"

          {
            echo "Package: linrar"
            echo "Version: ${VERSION_NUM}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Maintainer: Fahmi Kemal <fahmi@kemal.id>"
            echo "Homepage: https://github.com/fahmikemal/LinRAR"
            echo "Description: Modern universal archive manager for Linux in pure Rust"
            echo " LinRAR is a fast, safe, and intuitive universal archive manager for Linux supporting RAR, ZIP, TAR, 7z formats with native Wayland/X11 GUI and powerful CLI."
          } > "$DEB_DIR/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$DEB_DIR" "linrar_${VERSION_NUM}_amd64.deb"
          sha256sum "linrar_${VERSION_NUM}_amd64.deb" > "linrar_${VERSION_NUM}_amd64.deb.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LinRAR ${{ github.ref_name }}"
          files: |
            linrar-*.tar.gz
            linrar-*.tar.gz.sha256
            linrar_*.deb
            linrar_*.deb.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
